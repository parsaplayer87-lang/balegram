<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" data-accent="caspian">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Balegram — Telegram on Bale</title>
  <meta name="description" content="A full Telegram-style messenger experience, living inside Bale as a bot miniapp.">
  <meta name="theme-color" content="#0e8f8b">
  <script src="https://tapi.bale.ai/miniapp.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2314b8a6'/%3E%3Cstop offset='1' stop-color='%230e7490'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M14 32.5 49 17c1.8-.8 3.4.6 2.9 2.4l-7 27c-.4 1.7-2.3 2.3-3.7 1.2l-8.6-6.6-4.7 4.6c-1 1-2.6.5-2.9-.8l-2.2-8.9-8-2.6c-1.6-.5-1.7-2.2-.8-2.8z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app" aria-live="polite">
    <aside id="left-pane" class="pane"></aside>
    <main id="right-pane" class="pane"></main>
  </div>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="sheet-root"></div>
  <div id="context-root"></div>
  <div id="toast-root" role="status"></div>
  <div id="lightbox-root"></div>
  <input type="file" id="file-photo" accept="image/*" multiple hidden>
  <input type="file" id="file-any" hidden>
  <noscript><div style="padding:2rem;font-family:sans-serif">Balegram needs JavaScript to run.</div></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
